<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלון החלטות כותר</title>
<style>
  :root { --ink: #1E1E1E; --muted: #5b5b5b; --paper: #F6F3EE; --card: #fff; --line: #DDD6CA; --yes: #2F6B3A; --no: #9B2C2C; --accent: #8A5A2B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Assistant", "Segoe UI", Arial, sans-serif; line-height: 1.55; font-size: 16px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 8px; }
  .progress { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 10px 0; border-block-end: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar { flex: 1; min-width: 140px; height: 8px; background: #E8E2D8; border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  section { margin-top: 28px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .q.answered { border-inline-start: 4px solid var(--accent); }
  .q-head { display: flex; gap: 10px; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #EFE9DF; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .q-text b { display: block; }
  .why { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .flag { display: inline-block; font-size: 12px; background: #FBEBD6; color: #7A4A12; border-radius: 4px; padding: 1px 6px; margin-inline-start: 6px; font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-inline-start: 38px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; min-height: 44px; background: #FCFBF9; }
  .opts input { accent-color: var(--accent); width: 18px; height: 18px; }
  .opts label:has(input:checked) { border-color: var(--ink); background: #F1ECE4; font-weight: 600; }
  .note { display: block; width: calc(100% - 38px); margin: 8px 38px 0 0; margin-inline-start: 38px; margin-inline-end: 0; font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 40px; }
  .actions { position: fixed; inset-inline: 0; bottom: 0; background: var(--card); border-block-start: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: #fff; }
  button.ghost { background: transparent; color: var(--ink); }
  #out { width: 100%; min-height: 160px; margin-top: 24px; font: inherit; font-size: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; display: none; }
  .toast { position: fixed; bottom: 80px; inset-inline: 0; margin: auto; width: fit-content; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>שאלון החלטות: המעבר ל"כותר"</h1>
  <p class="lead">30 ההחלטות מתכנית הספרינט, מסודרות לפי נושא. כל שאלה היא המלצה. מסמנים כן או לא, ואם צריך כותבים הערה. בסוף לוחצים "העתק תשובות" ומדביקים בצ'אט.</p>
  <p class="lead">התשובות נשמרות בדפדפן הזה בלבד, כך שאפשר לסגור ולחזור.</p>
  <div class="progress"><div class="bar"><span id="bar"></span></div><span class="count" id="count">0 מתוך 30</span></div>
  <div id="form"></div>
  <textarea id="out" readonly aria-label="התשובות להדבקה"></textarea>
</main>
<div class="actions">
  <button id="copy">העתק תשובות</button>
  <button id="allyes" class="ghost">סמן "כן" בכל מה שלא נענה</button>
  <button id="reset" class="ghost">נקה הכל</button>
</div>
<div class="toast" id="toast">הועתק</div>

<script>
const GROUPS = [
  { title: 'השקה', items: [
    [1, 'השקה ביום שלישי, 2026-11-17.', 'יום באמצע שבוע עבודה, עם יומיים לתיקונים. אם שער שבועי לא נסגר, ההשקה זזה ל-2026-11-24.'],
    [25, 'האתר בהשקה: שם, לוגו, שורת תיאור ובלוק קצר "למה כותר". בלי עיצוב מחדש ובלי דפים חדשים.', 'כל שינוי נוסף מגדיל את הסיכון בהעברה.'],
    [27, 'כל ענף פתוח באתר ממוזג או נסגר עד 2026-11-08, כולל ענף המדידה וההסכמה.', 'ענף ההשקה נבנה על main נקי.'],
  ]},
  { title: 'דומיין ואתר', items: [
    [2, 'הכתיב הלטיני הוא KOTHAR, לא KOTAR.', 'kotar.co.il שייך לספרייה של מטח, ו-KOTHAR גם מחבר לקותר-וחסיס.'],
    [3, 'קונים רק את kothar.co.il, השבוע, בלי דומיינים נוספים.', 'ה-com וה-me תפוסים, וכמעט אף אחד לא מקליד את השם.'],
    [4, 'kothar.co.il עובר ל-Cloudflare ומתחבר לאותו פרויקט באתר.', 'דומיין ראשי בפרויקט כזה חייב לשבת ב-Cloudflare.'],
    [5, 'baimbetov.me נשאר רשום שנתיים לפחות, עם חידוש אוטומטי.', 'גוגל ממליץ על שנה לפחות, והחידוש זול מאיבוד ההפניות.'],
    [6, 'הפניה קבועה (301) מכל כתובת ב-baimbetov.me לאותה כתובת ב-kothar.co.il, דרך Bulk Redirects ב-Cloudflare.', 'פעולה אחת שתופסת כל נתיב, כולל הקישורים הקצרים.'],
    [7, 'אף נתיב באתר לא משתנה בהשקה.', 'משנים רק דומיין, כדי שגוגל יראה העברה נקייה ולא אתר חדש.'],
    [8, 'Change of Address בסרץ\' קונסול ביום ההשקה.', 'הכלי של גוגל להעברת דומיין. דורש בעלות על שני הנכסים.'],
  ]},
  { title: 'סימן מסחר', items: [
    [9, 'סימן מילולי "כותר" בעברית, בסוגים 37 ו-42.', '37 הוא בנייה והתקנה, 42 הוא התכנון ההנדסי.'],
    [10, 'אתה מגיש בעצמך במערכת המקוונת של רשות הפטנטים, אחרי חיפוש עצמי במאגר.', 'שני סוגים ושם אחד הם בקשה פשוטה. את האגרה תראה במסך התשלום.'],
    [11, 'עורך דין רק אם החיפוש מעלה סימן זהה או דומה בסוג 37 או 42.', 'אז לא מגישים לבד.'],
    [12, 'אם "כותר" או "Kotar" רשום בסוג 42 (למשל של מטח), מגישים בסוג 37 בלבד.', 'זה הליבה, ונמנעים מהתנגדות בטוחה.'],
    [13, 'לא מחכים לרישום כדי להשיק, ולא מציגים ® עד שהסימן נרשם.', 'הצגת סימן כרשום לפני הרישום היא עבירה.'],
    [14, 'KOTHAR הלטיני והסמל הגרפי לא נרשמים עכשיו.', 'נבחנים שוב בעוד שנה, כשיש שימוש.'],
  ]},
  { title: 'רשתות ווואטסאפ', items: [
    [15, 'שם משתמש אחיד בכל הרשתות: kothar.il. אם הוא תפוס ולו ברשת אחת, כולן עוברות ל-kothar.co.il.', 'תבנית אחת, והגיבוי זהה לדומיין.'],
    [16, 'ברשתות רק תופסים את השם: חשבון עם לוגו ותיאור, בלי פוסטים.', 'שירות הרשתות לא פעיל אצל הלקוח.'],
    [17, 'בוואטסאפ ביזנס השם "כותר" בלבד, והתמונה היא הסמל. מחליפים ביום ההשקה.', 'שם אחד, בלי שורת תיאור.'],
  ]},
  { title: 'פרופיל העסק בגוגל', items: [
    [18, 'שולחים השבוע לתמיכה של גוגל את ההודעה מסעיף 3.4 בתכנית, באנגלית.', 'המונחים של המדיניות באנגלית, כך לא נשאר מקום לפרשנות.'],
    [19, 'אם גוגל מאשר לשנות באותו פרופיל ולשמור את הביקורות: משנים את השם ביום ההשקה.', 'ענף א\'.'],
    [20, 'אם גוגל עונה שזה עסק חדש, או שאין תשובה ברורה עד 2026-11-12: ביום ההשקה מסמנים את הישן כסגור ופותחים "כותר" חדש.', 'ענף ב\'. זה מה שהמדיניות הכתובה אומרת, וזה מונע השעיה.'],
    [21, 'בענף ב\', אתה מבקש מכל לקוח שכתב ביקורת לכתוב גם בפרופיל החדש.', 'בוואטסאפ, בלי תמריץ ובלי לנסח לו מה לכתוב.'],
    [22, 'השם בפרופיל הוא "כותר" בלבד, בלי KOTHAR ובלי שורת התיאור.', 'גוגל אוסר שם כפול בשתי שפות וסלוגן בשם.'],
  ]},
  { title: 'לוגו', items: [
    [23, 'הלוגו: סבב תיקונים אחד, אישור עד 2026-11-05. ניקוד בחותם בלבד, הגרסה האופקית בלי ניקוד.', 'הכרעת המנכ"ל בסתירה מול האסטרטג: בלי ניקוד "כותר" נקרא koter, והחותם גדול מספיק כדי להראות את ההגייה.', ['כן, ניקוד בחותם בלבד', 'בלי ניקוד בכלל', 'ניקוד בכל הגרסאות'], 'שונה'],
    [24, 'בדיקת צריבה עד 2026-11-10: הדפסה בגודל אמיתי על עץ וצילום. הצריבה האמיתית עוברת לאחרי ההשקה.', 'אין גישה ללייזר או לברזל צריבה עד אז, וכך הבדיקה לא עוצרת את ההשקה.'],
  ]},
  { title: 'סיפור, תוכן וערוצים', items: [
    [26, 'הבלוק "למה כותר" מספר את שתי השכבות. הבדיקה בשטח מול הקהל הדתי יוצאת מהשער של ההשקה.', 'אתה מספר את הסיפור לשלושת האנשים הראשונים שאתה פוגש ממילא, ורושם את התגובה.', null, 'משנה החלטה קודמת'],
    [29, 'ערכת הקבלנים ודף העבודות לא נשלחים בשם הישן.', 'הם מתעדכנים ל"כותר" לפני השימוש הראשון.', null, 'משנה החלטה קודמת'],
  ]},
  { title: 'עסק ותיק לקוח', items: [
    [28, 'הישות המשפטית לא משתנה בספרינט. "כותר" מופיע כשם מסחרי בראש החשבונית, אחרי אישור רואה החשבון.', 'שינוי ישות הוא תהליך נפרד, ולא צריך אותו כדי להשיק.'],
    [30, 'המנכ"ל מעדכן את התיק אחרי האישור: השם ב-client.md וב-facts.md, וסעיף 4.5 למיצוב המשולב.', 'בלי זה הקופירייטרית כותבת לפי הכלל הישן.'],
  ]},
];
const KEY = 'kothar-decisions-2026-10-29';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const form = document.getElementById('form');
for (const g of GROUPS) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${g.title}</h2>`;
  for (const [n, text, why, opts, flag] of g.items) {
    const options = opts || ['כן', 'לא'];
    const q = document.createElement('div');
    q.className = 'q'; q.id = 'q' + n;
    q.innerHTML = `<div class="q-head"><span class="num">${n}</span><div class="q-text"><b>${text}${flag ? `<span class="flag">${flag}</span>` : ''}</b><div class="why">${why}</div></div></div>`
      + `<div class="opts" role="radiogroup" aria-label="החלטה ${n}">` + options.map((o, i) =>
        `<label><input type="radio" name="d${n}" value="${o}">${o}</label>`).join('') + `</div>`
      + `<textarea class="note" rows="1" placeholder="הערה (לא חובה)" aria-label="הערה להחלטה ${n}"></textarea>`;
    const s = state[n] || {};
    if (s.v) q.querySelector(`input[value="${s.v}"]`).checked = true;
    if (s.note) q.querySelector('.note').value = s.note;
    q.addEventListener('change', e => { if (e.target.type === 'radio') { state[n] = { ...state[n], v: e.target.value }; save(); refresh(); } });
    q.querySelector('.note').addEventListener('input', e => { state[n] = { ...state[n], note: e.target.value }; save(); });
    sec.appendChild(q);
  }
  form.appendChild(sec);
}
function refresh() {
  let done = 0;
  for (let n = 1; n <= 30; n++) {
    const a = !!(state[n] && state[n].v);
    document.getElementById('q' + n).classList.toggle('answered', a);
    if (a) done++;
  }
  document.getElementById('count').textContent = `${done} מתוך 30`;
  document.getElementById('bar').style.width = (done / 30 * 100) + '%';
}
refresh();

function answersText() {
  const lines = [];
  for (let n = 1; n <= 30; n++) {
    const s = state[n] || {};
    let line = `${n} ${s.v || 'לא נענה'}`;
    if (s.note && s.note.trim()) line += ` (${s.note.trim()})`;
    lines.push(line);
  }
  return 'תשובות לשאלון ההחלטות של כותר:\n' + lines.join('\n');
}
const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); };
document.getElementById('copy').onclick = async () => {
  const text = answersText();
  const out = document.getElementById('out');
  out.value = text; out.style.display = 'block';
  try { await navigator.clipboard.writeText(text); toast('הועתק, אפשר להדביק בצ\'אט'); }
  catch (e) { out.select(); toast('סמן והעתק מהתיבה למטה'); }
};
document.getElementById('allyes').onclick = () => {
  for (let n = 1; n <= 30; n++) {
    if (state[n] && state[n].v) continue;
    const first = document.querySelector(`input[name="d${n}"]`);
    first.checked = true; state[n] = { ...state[n], v: first.value };
  }
  save(); refresh();
};
document.getElementById('reset').onclick = () => {
  if (!confirm('לנקות את כל התשובות?')) return;
  state = {}; save();
  document.querySelectorAll('input[type=radio]').forEach(i => i.checked = false);
  document.querySelectorAll('.note').forEach(t => t.value = '');
  document.getElementById('out').style.display = 'none';
  refresh();
};
</script>
</body>
</html>
