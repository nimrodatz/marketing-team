<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כותר, ללא העיגול</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #F4F2EE; color: #1E1E1E; font-family: Arial, Helvetica, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; }
  figure { margin: 0; background: #FFFFFF; border: 1px solid #DDD8CF; padding: 20px; display: flex; flex-direction: column; }
  figure.dark { background: #1E1E1E; color: #FFFFFF; border-color: #1E1E1E; }
  figure .box { flex: 1; display: flex; align-items: center; justify-content: center; }
  img { display: block; width: 100%; height: auto; max-height: 440px; }
  figcaption { font-size: 15px; font-weight: 700; margin-top: 14px; }
  h2 { font-size: 17px; margin: 28px 0 12px; }
  .small { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; }
  .small img { width: auto; }
</style>
</head>
<body>
<h1>כותר, ללא העיגול</h1>
<h2>המשפט בפונט החדש</h2>
<div class="grid">
  <figure><div class="box"><img src="kothar-fonttag-keep-v6-fine-kr.svg" alt="כותר כמו היום, המשפט בפונט החלול"></div><figcaption>א: כותר כמו היום</figcaption></figure>
  <figure><div class="box"><img src="kothar-fonttag-solid-v6-fine-kr.svg" alt="כותר בסגנון הפונט, מלא, והמשפט בפונט החלול"></div><figcaption>ב: כותר בסגנון הפונט, מלא</figcaption></figure>
  <figure class="dark"><div class="box"><img src="kothar-fonttag-keep-v6-fine-kr-white.svg" alt="גרסה א בלבן"></div><figcaption>א על רקע כהה</figcaption></figure>
  <figure class="dark"><div class="box"><img src="kothar-fonttag-solid-v6-fine-kr-white.svg" alt="גרסה ב בלבן"></div><figcaption>ב על רקע כהה</figcaption></figure>
</div>
<h2>בגודל קטן, ברוחב 220 פיקסלים</h2>
<div class="small">
  <img src="kothar-fonttag-keep-v6-fine-kr.svg" style="width:220px" alt="גרסה א ברוחב 220 פיקסלים">
  <img src="kothar-fonttag-solid-v6-fine-kr.svg" style="width:220px" alt="גרסה ב ברוחב 220 פיקסלים">
</div>
<h2>הנוסח בפונט המקורי</h2>
<h2>נוסח חדש: תכנון. הנדסה. ביצוע / עץ ומתכת</h2>
<div class="grid">
  <figure><div class="box"><img src="kothar-noring-metal-v6-fine-kr.svg" alt="הנוסח החדש בשחור"></div><figcaption>הנוסח החדש</figcaption></figure>
  <figure class="dark"><div class="box"><img src="kothar-noring-metal-v6-fine-kr-white.svg" alt="הנוסח החדש בלבן"></div><figcaption>על רקע כהה</figcaption></figure>
  <figure><div class="box"><img src="kothar-noring-two-lines-v6-fine-kr.svg" alt="הנוסח הקודם בשתי שורות"></div><figcaption>הנוסח הקודם, להשוואה</figcaption></figure>
</div>
<h2>משפט ישר ומוגדל</h2>
<div class="grid">
  <figure><div class="box"><img src="kothar-noring-line-v6-fine-kr.svg" alt="המשפט בגודל הקודם"></div><figcaption>הגודל הקודם</figcaption></figure>
  <figure><div class="box"><img src="kothar-noring-line-large-v6-fine-kr.svg" alt="המשפט בשורה אחת מוגדלת"></div><figcaption>שורה אחת, גדולה יותר</figcaption></figure>
  <figure><div class="box"><img src="kothar-noring-two-lines-v6-fine-kr.svg" alt="המשפט בשתי שורות"></div><figcaption>שתי שורות, גדולות יותר</figcaption></figure>
</div>
<div class="small" style="margin-top:20px">
  <img src="kothar-noring-line-v6-fine-kr.svg" style="width:220px" alt="הגודל הקודם, ברוחב 220 פיקסלים">
  <img src="kothar-noring-line-large-v6-fine-kr.svg" style="width:220px" alt="שורה אחת, ברוחב 220 פיקסלים">
  <img src="kothar-noring-two-lines-v6-fine-kr.svg" style="width:220px" alt="שתי שורות, ברוחב 220 פיקסלים">
</div>
<h2>הניסיון הקודם</h2>
<div class="grid">
  <figure><div class="box"><img src="kothar-seal-v6-fine-kr.svg" alt="הלוגו הנוכחי, עם העיגול"></div><figcaption>היום: עם העיגול</figcaption></figure>
  <figure><div class="box"><img src="kothar-noring-arc-v6-fine-kr.svg" alt="ללא העיגול, המשפט בקשת"></div><figcaption>א: ללא העיגול, המשפט נשאר בקשת</figcaption></figure>
  <figure><div class="box"><img src="kothar-noring-line-v6-fine-kr.svg" alt="ללא העיגול, המשפט בשורה ישרה"></div><figcaption>ב: ללא העיגול, המשפט בשורה ישרה</figcaption></figure>
</div>
<h2>על רקע כהה</h2>
<div class="grid">
  <figure class="dark"><div class="box"><img src="kothar-noring-arc-v6-fine-kr-white.svg" alt="גרסה א בלבן"></div><figcaption>א</figcaption></figure>
  <figure class="dark"><div class="box"><img src="kothar-noring-line-v6-fine-kr-white.svg" alt="גרסה ב בלבן"></div><figcaption>ב</figcaption></figure>
</div>
<h2>בגובה 160 פיקסלים</h2>
<div class="small">
  <img src="kothar-seal-v6-fine-kr.svg" style="height:160px" alt="היום">
  <img src="kothar-noring-arc-v6-fine-kr.svg" style="height:160px" alt="א">
  <img src="kothar-noring-line-v6-fine-kr.svg" style="height:160px" alt="ב">
</div>
</body>
</html>
